services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ragfather_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  neo4j:
    image: neo4j:5.20-community
    container_name: ragfather_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP Browser UI
      - "7687:7687"   # Bolt (driver connection)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      NEO4J_AUTH: neo4j/clausepassword
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ragfather_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - QDRANT_URL=http://ragfather_qdrant:6333
      - NEO4J_URI=bolt://ragfather_neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=clausepassword
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
      - neo4j

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: ragfather_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
